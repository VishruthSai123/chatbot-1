version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      next:
        patterns:
          - "next"
          - "next-auth"
          - "@next/*"
      ai:
        patterns:
          - "ai"
          - "@ai-sdk/*"
          - "@openrouter/*"
      testing:
        patterns:
          - "@playwright/*"
          - "vitest"
          - "jest"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
